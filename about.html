<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://api.open-meteo.com; img-src 'self' data: https://*.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://komapc.github.io/gova/about.html" />
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
  <meta name="description" content="Gova is the cleanest GPS altimeter ever — no ads, no tracking, no accounts, no servers. Free, open-source, works offline. GPS + barometer + EGM96 geoid (MSL) + terrain. In Esperanto, English, Latviešu, Беларуская and Toki Pona." />
  <meta property="og:title" content="About Gova — the cleanest GPS altimeter ever" />
  <meta property="og:description" content="No ads. No tracking. No accounts. No servers. Just your altitude, done right. Free & open-source PWA, works offline." />
  <meta property="og:image" content="https://komapc.github.io/gova/icons/icon-512.png" />
  <meta property="og:url" content="https://komapc.github.io/gova/about.html" />
  <meta property="og:type" content="website" />
  <title>About Gova — the cleanest GPS altimeter ever</title>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Gova",
      "url": "https://komapc.github.io/gova/",
      "image": "https://komapc.github.io/gova/icons/icon-512.png",
      "operatingSystem": "Web, Android, iOS",
      "applicationCategory": "UtilitiesApplication",
      "description": "The cleanest GPS altimeter ever — no ads, no tracking, no accounts, no servers. Free, open-source, works offline. Altitude via GPS, EGM96 geoid (MSL), barometer and SRTM terrain.",
      "inLanguage": ["eo", "en", "lv", "be", "tok"],
      "isAccessibleForFree": true,
      "featureList": [
        "GPS altitude (WGS84)",
        "Mean-sea-level altitude via EGM96 geoid correction",
        "Barometric altitude",
        "Online terrain elevation (SRTM)",
        "Works fully offline",
        "No ads, no tracking, no accounts"
      ],
      "author": {
        "@type": "Person",
        "name": "komapc",
        "url": "https://github.com/komapc"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>
  <style>
    :root { --blue: #2563EB; --blue-2: #1e40af; --ink: #0f1115; --muted: #6b7280; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--ink);
      background: #f5f7fb;
      padding: 0 1rem 3rem;
    }
    .wrap { max-width: 760px; margin: 0 auto; }

    /* Language switcher */
    .langbar { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; padding: 1.4rem 0 .2rem; }
    .langbar button {
      border: 1px solid #d6dbe4; background: #fff; color: #374151;
      border-radius: 999px; padding: .35rem .8rem; font-size: .85rem; cursor: pointer;
      transition: all .15s ease;
    }
    .langbar button:hover { border-color: var(--blue); color: var(--blue); }
    .langbar button.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* Hero */
    .hero {
      margin-top: 1rem; padding: 2.6rem 2rem; border-radius: 20px; text-align: center;
      color: #fff; background: radial-gradient(120% 140% at 50% 0%, #3b82f6 0%, var(--blue) 40%, var(--blue-2) 100%);
      box-shadow: 0 18px 40px -18px rgba(37,99,235,.6);
    }
    .hero .logo { font-size: 3.4rem; font-weight: 800; letter-spacing: -1px; line-height: 1; }
    .hero .logo .dot { opacity: .55; }
    .hero .tagline { font-size: 1.25rem; font-weight: 600; margin-top: .8rem; }
    .hero .lede { font-size: 1rem; opacity: .95; margin: 1rem auto 0; max-width: 52ch; }

    /* Feature cards */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .9rem; margin-top: 1.4rem; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #fff; border: 1px solid #eceff4; border-radius: 14px; padding: 1.1rem 1.2rem;
      box-shadow: 0 1px 3px rgba(15,17,21,.05); transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -12px rgba(15,17,21,.25); }
    .card .ico { font-size: 1.5rem; }
    .card h3 { margin: .45rem 0 .25rem; font-size: 1.02rem; }
    .card p { margin: 0; color: var(--muted); font-size: .92rem; }

    .closing { text-align: center; font-size: 1.05rem; margin: 1.8rem auto 0; max-width: 50ch; color: #374151; }
    .cta { text-align: center; margin-top: 1.4rem; }
    .cta a {
      display: inline-block; background: var(--blue); color: #fff; text-decoration: none;
      font-weight: 600; padding: .7rem 1.5rem; border-radius: 999px; transition: background .15s ease;
    }
    .cta a:hover { background: var(--blue-2); }
    footer { margin-top: 2.2rem; text-align: center; font-size: .85rem; color: #94a3b8; }
    footer a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="langbar" id="langbar" aria-label="Language"></nav>

    <section class="hero">
      <div class="logo">Gova<span class="dot">.</span></div>
      <div class="tagline" id="tagline"></div>
      <p class="lede" id="lede"></p>
    </section>

    <div class="grid" id="grid"></div>

    <p class="closing" id="closing"></p>

    <div class="cta"><a href="./" id="cta"></a></div>

    <footer>
      © 2026 Gova · <a href="privacy.html" id="f-privacy">Privacy</a> ·
      <a href="https://github.com/komapc/gova" id="f-github">GitHub ↗</a>
    </footer>
  </div>

  <script src="js/about-page.js"></script>
</body>
</html>
