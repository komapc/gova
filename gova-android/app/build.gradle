plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.komapc.gova'
    compileSdk 35

    defaultConfig {
        applicationId "com.komapc.gova"
        minSdk 24
        targetSdk 35
        versionCode 31
        versionName "3.7.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            // Credentials come from env vars (CI secrets) or Gradle properties
            // (e.g. ~/.gradle/gradle.properties or local.properties). NEVER hardcode.
            def keystorePath = System.getenv("GOVA_KEYSTORE_PATH") ?: "../gova-release.keystore"
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("GOVA_KEYSTORE_PASSWORD") ?: (project.findProperty("GOVA_KEYSTORE_PASSWORD") ?: "")
                keyAlias System.getenv("GOVA_KEY_ALIAS") ?: (project.findProperty("GOVA_KEY_ALIAS") ?: "gova")
                keyPassword System.getenv("GOVA_KEY_PASSWORD") ?: (project.findProperty("GOVA_KEY_PASSWORD") ?: "")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
}
