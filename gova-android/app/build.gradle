plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.komapc.gova'
    compileSdk 35

    defaultConfig {
        applicationId "com.komapc.gova"
        minSdk 24
        targetSdk 35
        // Both versionCode and the versionName patch are driven by CI from the
        // workflow run number, so every build auto-increments and stays in
        // lockstep — no manual bump per PR:
        //   versionCode = 1000 + run_number   (e.g. 1089)
        //   versionName = 3.7.<run_number>    (e.g. 3.7.89)
        // The "3.7" base is the marketing major.minor — bump it by hand here
        // for a real minor/major release. Both fall back for local builds.
        def govaVersionCode = (System.getenv("GOVA_VERSION_CODE") ?: project.findProperty("GOVA_VERSION_CODE") ?: "31").toString().toInteger()
        def govaVersionPatch = (System.getenv("GOVA_VERSION_PATCH") ?: project.findProperty("GOVA_VERSION_PATCH") ?: "0").toString()
        versionCode govaVersionCode
        versionName "3.7.${govaVersionPatch}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            // Credentials come from env vars (CI secrets) or Gradle properties
            // (e.g. ~/.gradle/gradle.properties or local.properties). NEVER hardcode.
            def keystorePath = System.getenv("GOVA_KEYSTORE_PATH") ?: "../gova-release.keystore"
            def keystoreFile = file(keystorePath)
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("GOVA_KEYSTORE_PASSWORD") ?: (project.findProperty("GOVA_KEYSTORE_PASSWORD") ?: "")
                keyAlias System.getenv("GOVA_KEY_ALIAS") ?: (project.findProperty("GOVA_KEY_ALIAS") ?: "gova")
                keyPassword System.getenv("GOVA_KEY_PASSWORD") ?: (project.findProperty("GOVA_KEY_PASSWORD") ?: "")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        // Pinned to Kotlin 1.9.25 (see root build.gradle). If you bump Kotlin,
        // bump this to the matching Compose compiler per the compatibility map.
        kotlinCompilerExtensionVersion '1.5.15'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
