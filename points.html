  <style>
    .points-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .point-card {
      background: var(--bg-secondary);
      padding: 1rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .point-info {
      flex: 1;
    }
    .point-name {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
      font-size: 1.125rem;
    }
    .point-meta {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }
    .point-altitude {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-color);
      font-family: monospace;
      margin-left: 1rem;
    }
    .point-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: 1rem;
    }
    .btn-small {
      padding: 0.5rem;
      border: none;
      background: var(--bg-hover);
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .btn-small:hover {
      background: var(--bg-active);
    }
    .btn-delete {
      color: #EF4444;
    }
  </style>
  <title>Konservitaj Punktoj — Gova</title>

    <div></div> <!-- Spacer -->
  </header>

  <main class="history-main">
    
    <div id="points-list" class="points-list">
      <!-- Punktoj aperos ĉi tie -->

    <!-- Neniu Datumoj -->

      <p data-i18n="noPoints">Neniu konservita punkto ankoraŭ</p>
