name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'  # ESLint 10 requires Node 20+
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint
      
    - name: Build check
      run: |
        echo "Checking if all files exist..."
        test -f index.html
        test -f history.html
        test -f js/app.js
        test -f js/history.js
        test -f js/chart.js
        test -f js/theme.js
        test -f js/install.js
        test -f css/main.css
        test -f css/history.css
        test -f gova-android/gradle.properties
        test -f gova-android/app/build.gradle
        test -f gova-android/app/src/main/AndroidManifest.xml
        echo "All files present!"
    
    - name: Run tests
      run: npm test
