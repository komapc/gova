name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permesas mane lanĉi la konstruon el GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./gova-android

    env:
      # Surfaced as env so the publish step can self-skip until the secret
      # is configured (you can't reference secrets directly in a step `if`).
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
    - uses: actions/checkout@v7

    # Unique, always-increasing version for every build, driven by the run
    # number: versionCode = 1000 + run (safely above old manual codes 30/31),
    # versionName = 3.7.<run>. Both auto-increment on every PR/merge.
    - name: Compute version
      run: |
        echo "GOVA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
        echo "GOVA_VERSION_PATCH=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 8.7
        cache-disabled: true # Temporarily disabled to bypass GitHub cache service 400 errors

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    # The upload key MUST stay constant across builds, or Google Play will
    # reject updates. Store the keystore (base64) and passwords as repo
    # secrets — never regenerate it in CI.
    - name: Decode Release Keystore
      env:
        GOVA_KEYSTORE_BASE64: ${{ secrets.GOVA_KEYSTORE_BASE64 }}
      run: echo "$GOVA_KEYSTORE_BASE64" | base64 -d > gova-release.keystore

    - name: Build Release AAB
      env:
        GOVA_KEYSTORE_PASSWORD: ${{ secrets.GOVA_KEYSTORE_PASSWORD }}
        GOVA_KEY_ALIAS: ${{ secrets.GOVA_KEY_ALIAS }}
        GOVA_KEY_PASSWORD: ${{ secrets.GOVA_KEY_PASSWORD }}
      run: ./gradlew bundleRelease --no-daemon

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v7
      with:
        name: gova-release-aab
        path: gova-android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 7

    # --- Auto-publish to Google Play (Internal testing) ---
    # Runs ONLY on merges/pushes to main, never on PRs. Requires the
    # PLAY_SERVICE_ACCOUNT_JSON secret and a first manual upload on the
    # Internal testing track (the API can only update an existing track).
    - name: Publish to Play (Internal testing)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.komapc.gova
        releaseFiles: gova-android/app/build/outputs/bundle/release/app-release.aab
        tracks: internal
        status: completed
