name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permesas mane lanĉi la konstruon el GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./gova-android

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7
        cache-disabled: true # Temporarily disabled to bypass GitHub cache service 400 errors

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    # The upload key MUST stay constant across builds, or Google Play will
    # reject updates. Store the keystore (base64) and passwords as repo
    # secrets — never regenerate it in CI.
    - name: Decode Release Keystore
      env:
        GOVA_KEYSTORE_BASE64: ${{ secrets.GOVA_KEYSTORE_BASE64 }}
      run: echo "$GOVA_KEYSTORE_BASE64" | base64 -d > gova-release.keystore

    - name: Build Release AAB
      env:
        GOVA_KEYSTORE_PASSWORD: ${{ secrets.GOVA_KEYSTORE_PASSWORD }}
        GOVA_KEY_ALIAS: ${{ secrets.GOVA_KEY_ALIAS }}
        GOVA_KEY_PASSWORD: ${{ secrets.GOVA_KEY_PASSWORD }}
      run: ./gradlew bundleRelease --no-daemon
      
    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gova-release-aab
        path: gova-android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 7
